[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendrm"
version = "0.1.0"
description = "Sign opendrm playback tokens in your backend. Standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://open-drm.com"
Documentation = "https://docs.open-drm.com"
Source = "https://github.com/opendrm-org/opendrm-python"
Issues = "https://github.com/opendrm-org/opendrm-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
